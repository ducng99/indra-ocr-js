# Builds demo/ with bun and pushes the bundle to GitHub Pages and to a
# Hugging Face Space (static SDK) in parallel.  Manual runs only.
#
# One-time repo setup:
#   - Pages: Settings → Pages → Build and deployment → Source: GitHub Actions
#   - secret HF_TOKEN: Hugging Face token with write access to the Space
#   - variable HF_SPACE: Space to update, as "owner/name" (sdk: static)
name: Deploy demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build demo
        working-directory: demo
        run: |
          bun install --frozen-lockfile
          bun run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo/dist

      - uses: actions/upload-artifact@v7
        with:
          name: demo-dist
          path: demo/dist

  github-pages:
    needs: build
    runs-on: ubuntu-slim
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  hf-space:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # required so the job can request an OIDC token
      contents: read

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: demo-dist
          path: dist

      - name: Install the hf CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Push to the Hugging Face Space
        working-directory: dist
        env:
          HF_OIDC_RESOURCE: spaces/${{ vars.HF_SPACE }}
        run: hf upload "${{ vars.HF_SPACE }}" . --repo-type space
