<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>indra-ocr in the browser (ONNX Runtime: wasm)</title>
<!--
  The importmap pins onnxruntime-web's ESM wasm-only build.  The wasm files
  resolve next to it on the CDN.  In a bundler/npm app there is no importmap:
  just `npm i onnxruntime-web`.
-->
<script type="importmap">
{
  "imports": {
    "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0-dev.20250409-89f8206ba4/dist/ort.wasm.bundle.min.mjs"
  }
}
</script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; }
  #side { width: 340px; padding: 16px; box-sizing: border-box; overflow-y: auto;
          border-right: 1px solid #ddd; background: #fafafa; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #canvasWrap { flex: 1; overflow: auto; background: #333; position: relative; text-align: center; }
  canvas { max-width: 100%; max-height: 100%; margin: auto; display: block; }
  #text { height: 30%; overflow: auto; margin: 0; padding: 12px; white-space: pre-wrap;
          border-top: 1px solid #ddd; font: 13px/1.45 ui-monospace, monospace; background: #fff; }
  label { display: block; margin: 10px 0 3px; font-size: 13px; color: #444; }
  input[type=text], select { width: 100%; box-sizing: border-box; padding: 4px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button { padding: 6px 14px; cursor: pointer; }
  #drop { border: 2px dashed #bbb; border-radius: 6px; padding: 18px; text-align: center;
          color: #777; font-size: 13px; margin-top: 8px; }
  #drop.busy { border-color: #4a9; color: #4a9; }
  #status { font-size: 12px; color: #666; margin-top: 10px; min-height: 3em; white-space: pre-wrap; }
  code { background: #eee; padding: 1px 4px; border-radius: 3px; font-size: 11px; }
</style>
</head>
<body>
<div id="side">
  <h3 style="margin:0 0 4px">indra-ocr</h3>
  <div style="font-size:12px;color:#666">det + CTC rec + reading order, on onnxruntime-web (wasm)</div>

  <label for="base">Model base URL (your HF repo)</label>
  <input id="base" type="text" value="/models"
         placeholder="https://huggingface.co/USER/indra-ocr/resolve/main" />

  <div class="row">
    <label><input type="checkbox" id="cjk" checked /> CJK models</label>
    <label><input type="checkbox" id="orient" checked /> orientation</label>
  </div>

  <label>Page image</label>
  <input id="file" type="file" accept="image/*" />
  <div id="drop">…or drop an image here</div>

  <p></p>
  <button id="run" disabled>Run OCR</button>
  <div id="status"></div>
</div>
<div id="main">
  <div id="canvasWrap"></div>
  <pre id="text">lines appear here</pre>
</div>

<script type="module">
import { loadIndra, readGrayBrowser } from "./indra-ocr-web.mjs";

const $ = (id) => document.getElementById(id);
const status = (s) => { $("status").textContent = s; };
let ocr = null, gray = null, page = null;

async function ensureModel() {
  const base = $("base").value.trim();
  const opts = {
    cjk: $("cjk").checked,
    orient: $("orient").checked,
  };
  const sig = JSON.stringify([base, opts.cjk, opts.orient]);
  if (ensureModel.sig !== sig) {
    status("loading models…");
    const t0 = performance.now();
    ocr = await loadIndra(base, opts);
    ensureModel.sig = sig;
    window.__device = ocr.device;
    status(`models loaded in ${Math.round(performance.now() - t0)} ms (${ocr.device})`);
  }
  return ocr;
}

async function showImage(src) {
  gray = await readGrayBrowser(src);
  page = null;
  $("run").disabled = false;
  const wrap = $("canvasWrap");
  wrap.innerHTML = "";
  const c = document.createElement("canvas");
  c.width = gray.width;
  c.height = gray.height;
  const ctx = c.getContext("2d");
  const img = ctx.createImageData(gray.width, gray.height);
  for (let i = 0, p = 0; i < gray.data.length; i++, p += 4) {
    img.data[p] = img.data[p + 1] = img.data[p + 2] = gray.data[i];
    img.data[p + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  wrap.appendChild(c);
  window.__canvas = c;
}

async function run() {
  if (!gray) return;
  $("run").disabled = true;
  $("drop").classList.add("busy");
  status("running…");
  await new Promise((r) => setTimeout(r, 30)); // let the UI paint
  try {
    const t0 = performance.now();
    page = await (await ensureModel()).__call__(gray);
    const ms = Math.round(performance.now() - t0);
    $("text").textContent = page.text;
    status(`${page.lines.length} lines in ${ms} ms (rotation ${page.rotation}°, ${window.__device ?? "?"})`);
    drawBoxes();
  } catch (e) {
    status("failed: " + (e?.message ?? e));
    console.error(e);
  }
  $("run").disabled = false;
  $("drop").classList.remove("busy");
}

function drawBoxes() {
  const c = window.__canvas;
  const ctx = c.getContext("2d");
  const s = c.width / gray.width; // canvas may be drawn at native res; CSS scales it
  ctx.lineWidth = Math.max(1.5, 1.5 / s);
  ctx.strokeStyle = "rgba(30, 170, 90, 0.9)";
  for (const l of page.lines) {
    const [x0, y0, x1, y1] = l.box;
    ctx.strokeRect(x0 * s, y0 * s, (x1 - x0) * s, (y1 - y0) * s);
  }
}

$("run").onclick = run;
$("file").onchange = () => $("file").files[0] && showImage($("file").files[0]);
const drop = $("drop");
drop.ondragover = (e) => { e.preventDefault(); };
drop.ondrop = (e) => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) showImage(f);
};

// Hook for the headless test (web/test-browser.mjs).
window.__test = async (imageUrl, base) => {
  $("base").value = base ?? $("base").value;
  await showImage(imageUrl);
  await run();
  return {
    lines: page?.lines ?? [], rotation: page?.rotation, text: page?.text ?? "",
    device: window.__device ?? null,
  };
};
</script>
</body>
</html>
